<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="'Noto Sans Thai', 'Sarabun', 'Leelawadee UI', Tahoma, sans-serif">
  <rect x="0" y="0" width="1200" height="700" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="55" text-anchor="middle" font-size="32" font-weight="700" fill="#1a1f29">บริษัทได้อะไรจากทั้งหมดนี้</text>
  <text x="600" y="86" text-anchor="middle" font-size="16" fill="#8a8a8a">F2P · จ่ายหนัก (Whale) · บริษัท (Company)</text>

  <!-- Header row background -->
  <rect x="80" y="130" width="1040" height="50" fill="#f4f4f4"/>
  <text x="100" y="163" font-size="18" font-weight="700" fill="#555555">ฝ่าย</text>
  <text x="400" y="163" font-size="18" font-weight="700" fill="#555555">ได้อะไร</text>

  <!-- Vertical divider -->
  <line x1="380" y1="130" x2="380" y2="660" stroke="#e2e2e2" stroke-width="1"/>

  <!-- Horizontal lines -->
  <line x1="80" y1="130" x2="1120" y2="130" stroke="#333333" stroke-width="1.5"/>
  <line x1="80" y1="180" x2="1120" y2="180" stroke="#333333" stroke-width="2.5"/>
  <line x1="80" y1="340" x2="1120" y2="340" stroke="#e2e2e2" stroke-width="1"/>
  <line x1="80" y1="500" x2="1120" y2="500" stroke="#e2e2e2" stroke-width="1"/>
  <line x1="80" y1="660" x2="1120" y2="660" stroke="#333333" stroke-width="1.5"/>

  <!-- Row 1: F2P -->
  <text x="100" y="267" font-size="22" font-weight="700" fill="#1a1f29">🎮 F2P (ไม่จ่ายเงิน)</text>
  <text x="400" y="248" font-size="19" fill="#333333">
    <tspan x="400" dy="0">เพดานที่ชัดเจน ทำให้ยังมีความหวังอยู่เสมอ</tspan>
    <tspan x="400" dy="30">แม้ดวงไม่ดี เก็บพอก็ได้แน่</tspan>
  </text>

  <!-- Row 2: Whale -->
  <text x="100" y="427" font-size="22" font-weight="700" fill="#1a1f29">💰 จ่ายหนัก (Whale)</text>
  <text x="400" y="408" font-size="19" fill="#333333">
    <tspan x="400" dy="0">มั่นใจว่าเงินทุกบาทที่จ่ายไปมีเพดานชัดเจน</tspan>
    <tspan x="400" dy="30">ไม่มีทางจ่ายเกินราคาที่ควรจะเป็น</tspan>
  </text>

  <!-- Row 3: Company -->
  <text x="100" y="587" font-size="22" font-weight="700" fill="#1a1f29">🏢 บริษัท (Company)</text>
  <text x="400" y="568" font-size="19" fill="#333333">
    <tspan x="400" dy="0">ได้ "ความสามารถในการคาดการณ์" ทั้งรายได้ต่อ banner</tspan>
    <tspan x="400" dy="30">และพฤติกรรมของผู้เล่นในระยะยาว</tspan>
  </text>
</svg>
